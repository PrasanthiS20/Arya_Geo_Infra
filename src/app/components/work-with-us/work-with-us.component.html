<section id="contact" class="section work-with-us-section">
  <div class="container">
    <div class="cta-box">
      <!-- Ambient Glow Decor -->
      <div class="cta-glow"></div>

      <div class="cta-content">
        <div class="section-tag cta-tag">WORK WITH US</div>
        <h2 class="cta-title">Let's discuss your next infrastructure project</h2>
        <p class="cta-desc">
          Whether you need highway design, CAD drafting, surveying support, civil construction execution, or geospatial solutions, our team is ready to support your project from planning through execution.
        </p>

        <!-- CTA Buttons matching PDF -->
        <div class="cta-buttons">
          <button class="btn btn-primary cta-btn-primary" (click)="openQuote()">
            <span>REQUEST A QUOTE</span>
            <svg class="btn-arrow" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
            </svg>
          </button>

          <a href="mailto:info@aryageoinfra.com" class="btn btn-navy-outline cta-btn-outline">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="mail-icon">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
            <span>EMAIL OUR TEAM</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
