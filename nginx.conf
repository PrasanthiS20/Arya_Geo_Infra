server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(?:css|js|map|json|png|jpg|jpeg|gif|svg|webp|avif|ico|woff|woff2|ttf|otf|pdf)$ {
        try_files $uri =404;
    }
}